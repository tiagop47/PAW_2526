<div class="container py-4">
  <!-- Navegação -->
  <div class="mb-4">
    <a routerLink="/supermercados" class="btn btn-sm btn-outline-secondary">← VOLTAR</a>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-secondary" role="status"></div>
  </div>

  <ng-container *ngIf="!loading && supermercado">
    <!-- Header Loja -->
    <div class="row align-items-center mb-4 pb-3 border-bottom">
      <div class="col">
        <h1 class="h3 fw-bold mb-1">{{ supermercado.nome }}</h1>
        <p class="text-muted small mb-0"><i class="bi bi-geo-alt"></i> {{ supermercado.localizacao }}</p>
      </div>
    </div>

    <!-- Filtro -->
    <div class="mb-4">
      <input type="text" class="form-control form-control-sm border-secondary" placeholder="Pesquisar produtos nesta loja..."
        [value]="pesquisa" (input)="onSearchChange($event)" />
    </div>

    <!-- Grelha -->
    <div class="row g-3">
      <div *ngFor="let p of produtosFiltrados" class="col-6 col-md-3 mb-3">
        <div class="card h-100 shadow-sm border">
          <div class="p-3 text-center bg-white border-bottom">
            <img [src]="p.imagem" [alt]="p.nome" class="img-fluid"
              style="height: 100px; object-fit: contain;">
          </div>
          <div class="card-body d-flex flex-column p-3">
            <div class="text-muted extra-small text-uppercase fw-bold mb-1">{{ p.categoriaId?.nome }}</div>
            <h6 class="fw-bold small mb-2 text-truncate">{{ p.nome }}</h6>
            <div class="h6 fw-bold text-dark mb-3 mt-auto">{{ p.preco | currency:'EUR' }}</div>
            
            <div class="d-grid gap-2">
              <a [routerLink]="['/product', p._id]" class="btn btn-sm btn-light border extra-small">DETALHES</a>
              <button class="btn btn-sm btn-primary extra-small fw-bold" (click)="adicionar(p)"
                [disabled]="p.stockDisponivel <= 0">
                {{ p.stockDisponivel > 0 ? 'ADICIONAR' : 'ESGOTADO' }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="produtosFiltrados.length === 0" class="text-center p-5 border rounded bg-light mt-4">
      <p class="text-muted mb-0">Nenhum produto disponível com este filtro.</p>
    </div>
  </ng-container>
</div>

<div class="avaliacoes-container">
  <h2 class="mb-4">Minhas Avaliações</h2>

  <div *ngIf="loading" class="text-center p-5">
    <div class="spinner-border text-primary"></div>
    <p>A carregar avaliações...</p>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="!loading && avaliacoes.length === 0" class="text-center p-5 bg-white border rounded">
    <p class="text-secondary">Ainda não fez nenhuma avaliação.</p>
  </div>

  <div *ngIf="!loading && avaliacoes.length > 0" class="avaliacoes-list">
    <div *ngFor="let av of avaliacoes" class="card mb-3">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div>
            <h5 class="mb-1">{{ av.supermercadoId?.nome || 'Supermercado' }}</h5>
            <div class="text-secondary small">
              Encomenda #{{ av.encomendaId.slice(-6).toUpperCase() }} • {{ av.criadoEm | date:'dd/MM/yyyy' }}
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col col-md-6">
            <label class="form-label small text-secondary d-block">Supermercado</label>
            <div class="estrelas">
              <span *ngFor="let e of estrelas" class="estrela" [class.ativa]="e <= av.notaSupermercado">★</span>
            </div>
          </div>
          <div class="col col-md-6" *ngIf="av.notaEstafeta">
            <label class="form-label small text-secondary d-block">Estafeta: {{ av.estafetaId?.nome || 'Estafeta' }}</label>
            <div class="estrelas">
              <span *ngFor="let e of estrelas" class="estrela" [class.ativa]="e <= av.notaEstafeta">★</span>
            </div>
          </div>
        </div>

        <div *ngIf="av.comentario" class="p-2 bg-light rounded small italic">
          "{{ av.comentario }}"
        </div>
      </div>
    </div>
  </div>
</div>

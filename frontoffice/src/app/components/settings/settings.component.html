<div class="container py-4">
  <div class="mx-auto" style="max-width: 800px;">
    <h2 class="h3 border-bottom pb-2 mb-4">Definições da Conta</h2>


    <div *ngIf="!initialLoading">
      <div *ngIf="message" class="alert alert-success small">{{ message }}</div>
      <div *ngIf="error" class="alert alert-danger small">{{ error }}</div>

      <div class="card border shadow-sm">
        <div class="card-header bg-light fw-bold py-3">
          Perfil do Utilizador
        </div>
        <div class="card-body p-4">
          <form [formGroup]="settingsForm" (ngSubmit)="onSubmit()">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label small fw-bold">Nome Completo</label>
                <input type="text" class="form-control" formControlName="nome">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold">Email (Não editável)</label>
                <input type="email" class="form-control bg-light" formControlName="email">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold">Telefone</label>
                <input type="text" class="form-control" formControlName="telefone">
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold">Morada de Entrega Predefinida</label>
                <input type="text" class="form-control" formControlName="morada">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold">NIF</label>
                <input type="text" class="form-control" formControlName="nif">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold">Supermercado Favorito</label>
                <select class="form-select" formControlName="supermercadoFavorito">
                  <option value="">Nenhum</option>
                  <option *ngFor="let sm of supermercados" [value]="sm._id">{{ sm.nome }}</option>
                </select>
              </div>
            </div>

            <div class="mt-4 border-top pt-3 d-flex justify-content-end">
              <button type="submit" class="btn btn-dark px-4 fw-bold" [disabled]="loading || settingsForm.invalid">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                Guardar Alterações
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="register-container">
  <div class="card register-card">
    <h2 class="text-center mb-4">Criar Conta</h2>

    <div *ngIf="errorMessage" class="alert alert-danger mb-4">{{ errorMessage }}</div>

    <form [formGroup]="registerForm">
      <div class="row">
        <div class="col col-md-6 mb-3">
          <label class="form-label">Nome Completo</label>
          <input type="text" class="form-control" formControlName="nome" placeholder="João Silva">
        </div>
        <div class="col col-md-6 mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email" placeholder="exemplo@mail.com">
        </div>
      </div>

      <div class="row">
        <div class="col col-md-6 mb-3">
          <label class="form-label">Palavra-passe</label>
          <input type="password" class="form-control" formControlName="password">
        </div>
        <div class="col col-md-6 mb-3">
          <label class="form-label">Telefone</label>
          <input type="text" class="form-control" formControlName="telefone">
        </div>
      </div>

      <div class="row">
        <div class="col col-md-6 mb-3">
          <label class="form-label">NIF</label>
          <input type="text" class="form-control" formControlName="nif">
        </div>
        <div class="col col-md-6 mb-3">
          <label class="form-label">Supermercado Favorito</label>
          <select class="form-control" formControlName="supermercadoFavorito">
            <option value="">Selecione um supermercado</option>
            <option *ngFor="let s of supermercados" [value]="s._id">{{ s.nome }}</option>
          </select>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Morada</label>
        <input type="text" class="form-control" formControlName="morada" placeholder="Rua, número, localidade...">
      </div>

      <button type="button" class="btn btn-primary w-100 mb-3" [disabled]="!registerForm.valid" (click)="onSubmit()">Criar Conta</button>

      <div class="text-center">
        <span class="text-secondary small">Já tem conta?</span><br>
        <a routerLink="/login" class="small">Entrar aqui</a>
      </div>
    </form>
  </div>
</div>

<div class="container">
  <div class="card register-container border shadow-sm">
    <div class="card-body p-4">
      <h3 class="card-title text-center fw-bold mb-4">Criar Nova Conta</h3>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="row g-3 mb-3">
          <div class="col-12">
            <label class="form-label small fw-bold">Nome Completo</label>
            <input type="text" class="form-control" formControlName="nome" placeholder="João Silva">
          </div>
          
          <div class="col-md-6">
            <label class="form-label small fw-bold">Email</label>
            <input type="email" class="form-control" formControlName="email" placeholder="joao&#64;email.com">
          </div>

          <div class="col-md-6">
            <label class="form-label small fw-bold">Telefone</label>
            <input type="text" class="form-control" formControlName="telefone" placeholder="912345678">
          </div>

          <div class="col-12">
            <label class="form-label small fw-bold">Morada Principal</label>
            <input type="text" class="form-control" formControlName="morada" placeholder="Rua das Flores, nº 10">
          </div>

          <div class="col-md-6">
            <label class="form-label small fw-bold">NIF (Opcional)</label>
            <input type="text" class="form-control" formControlName="nif" placeholder="123456789">
          </div>

          <div class="col-md-6">
            <label class="form-label small fw-bold">Palavra-passe</label>
            <input type="password" class="form-control" formControlName="password" placeholder="********">
          </div>

          <div class="col-12" *ngIf="supermercados.length > 0">
            <label class="form-label small fw-bold">Supermercado Favorito (Opcional)</label>
            <select class="form-select" formControlName="supermercadoFavorito">
              <option value="">Nenhum</option>
              <option *ngFor="let sm of supermercados" [value]="sm._id">{{ sm.nome }}</option>
            </select>
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger small py-2">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn btn-dark w-100 fw-bold py-2 mt-2" [disabled]="registerForm.invalid">
          Registar Conta
        </button>
      </form>

      <div class="mt-4 text-center border-top pt-3">
        <p class="text-muted small mb-0">Já tem conta? <a routerLink="/login" class="text-decoration-none">Inicie sessão</a></p>
      </div>
    </div>
  </div>
</div>

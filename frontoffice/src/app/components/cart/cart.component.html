<div class="cart-container">
  <h2 class="mb-4">O Meu Carrinho</h2>

  <div *ngIf="cartService.items().length === 0" class="text-center p-5 bg-white border rounded">
    <p class="text-secondary mb-4">O seu carrinho está vazio.</p>
    <a routerLink="/" class="btn btn-primary">Começar a Comprar</a>
  </div>

  <div *ngIf="cartService.items().length > 0" class="row">
    <div class="col col-lg-8">
      <div class="card mb-3">
        <div *ngFor="let item of cartService.items()" class="cart-item-row">
          <img [src]="item.imagem" [alt]="item.nome" class="cart-item-img">
          
          <div class="cart-item-info">
            <h6 class="mb-0">{{ item.nome }}</h6>
            <span class="text-secondary small">{{ item.preco | currency:'EUR' }}</span>
          </div>

          <div class="cart-item-actions">
            <button class="btn btn-sm btn-secondary" (click)="cartService.updateQuantity(item.produtoId, item.quantidade - 1)">-</button>
            <span class="mx-2">{{ item.quantidade }}</span>
            <button class="btn btn-sm btn-secondary" (click)="cartService.updateQuantity(item.produtoId, item.quantidade + 1)">+</button>
            <button class="btn btn-sm btn-danger ms-3" (click)="cartService.removeItem(item.produtoId)">✕</button>
          </div>
        </div>
      </div>
    </div>

    <div class="col col-lg-4">
      <div class="cart-summary">
        <h5 class="mb-4">Resumo</h5>
        <div class="d-flex justify-content-between mb-2">
          <span>Itens:</span>
          <span>{{ cartService.totalItems() }}</span>
        </div>
        <div class="d-flex justify-content-between mb-4 h5">
          <span>Total:</span>
          <span class="text-primary">{{ cartService.totalPrice() | currency:'EUR' }}</span>
        </div>
        
        <div class="mb-3">
          <label class="form-label small">Método de Entrega</label>
          <select class="form-control" [(ngModel)]="metodoEntrega">
            <option value="levantamento_loja">Levantamento em Loja</option>
            <option value="entrega_domicilio">Entrega ao Domicílio</option>
          </select>
        </div>

        <div class="mb-4" *ngIf="metodoEntrega === 'entrega_domicilio'">
          <label class="form-label small">Morada de Entrega</label>
          <input type="text" class="form-control" [(ngModel)]="moradaEntrega" placeholder="Rua, número, código postal...">
        </div>

        <button class="btn btn-primary w-100" (click)="finalizarEncomenda()" [disabled]="processando">
          {{ processando ? 'A processar...' : 'Finalizar Encomenda' }}
        </button>
      </div>
    </div>
  </div>
</div>

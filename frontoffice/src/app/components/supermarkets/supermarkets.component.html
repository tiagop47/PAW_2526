<div class="container py-4">

  <div class="row mb-4 align-items-center">
    <div class="col-md-8">
      <h2 class="h4 fw-bold border-bottom pb-2">Rede de Supermercados</h2>
      <p class="text-muted small">Encontre a loja mais próxima ou compare os preços na sua zona.</p>
    </div>
    <div class="col-md-4">
    <div class="mb-3">
      <label class="form-label extra-small fw-bold text-uppercase text-muted">Filtrar por Zona</label>
      <select class="form-select form-select-sm border-secondary" [value]="selectedZone" (change)="onZoneChange($event)">
        <option value="">Todas as Localidades</option>
        <option *ngFor="let zone of availableZones" [value]="zone">{{ zone }}</option>
      </select>
    </div>
    </div>
  </div>

  <div class="row g-3 mb-5">
    <div *ngFor="let s of filteredSupermarkets" class="col-md-4">
      <div class="card h-100 shadow-sm border" [class.border-primary]="s.isFavorito">
        <div class="card-body d-flex flex-column p-4 text-center">
          <div *ngIf="s.isFavorito" class="extra-small fw-bold text-uppercase text-primary mb-2">
            <i class="bi bi-pin-angle-fill"></i> Loja de Referência
          </div>

          <h5 class="fw-bold mb-1 text-uppercase">{{ s.nome }}</h5>
          <p class="text-muted small mb-3">{{ s.localizacao }}</p>

          <div *ngIf="s.distanciaRef !== null" class="alert alert-light border py-1 px-2 extra-small text-muted mb-3">
            A <strong>{{ s.distanciaRef.toFixed(1) }} km</strong> da sua referência
          </div>

          <div class="mt-auto d-grid gap-2">
            <button class="btn btn-outline-primary btn-sm fw-bold" (click)="navigateToMercado(s._id)">ENTRAR NA LOJA</button>
            <button class="btn btn-light btn-sm extra-small border" (click)="verNoMapa(s._id)">VER NO MAPA</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <section class="mt-5">
    <h5 class="fw-bold border-bottom pb-2 mb-4">Localização Geográfica</h5>
    <app-supermarket-map [supermarkets]="allSupermarkets" [favoritoId]="favoritoId"
        [focarSupermercado]="supermercadoNoMapa"></app-supermarket-map>
  </section>
</div>

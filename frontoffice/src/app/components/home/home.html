<div class="home-container">
  <div class="hero-section">
    <h1>Descubra os Supermercados</h1>
    <p>Escolha a sua zona e encontre as ofertas.</p>

    <div class="search-container">
      <select 
        class="search-select" 
        [ngModel]="selectedZone()"
        (ngModelChange)="selectedZone.set($event)"
      >
        <option value="">Todas as Localidades</option>
        <option *ngFor="let zone of availableZones()" [value]="zone">{{ zone }}</option>
      </select>
    </div>
  </div>
  
  <div class="zones-container">
    <div *ngFor="let zoneGroup of supermarketsByZone()" class="zone-section">
      <h2 class="zone-title">{{ zoneGroup.zone }}</h2>
      
      <div class="supermarket-grid">
        <div 
          *ngFor="let s of zoneGroup.supermarkets" 
          (click)="select(s._id)"
          class="supermarket-card"
        >
          <div class="card-content">
            <h3>{{ s.nome }}</h3>
            <p class="description" *ngIf="s.descricao">{{ s.descricao }}</p>
            <div class="delivery-methods" *ngIf="s.metodosEntrega && s.metodosEntrega.length">
              <span *ngFor="let method of s.metodosEntrega" class="badge">{{ method }}</span>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-enter">Ver Produtos</button>
          </div>
        </div>
      </div>
      
    </div>
  </div>
  
  <div *ngIf="supermarketsByZone().length === 0" class="empty-state">
    Nenhuma localidade encontrada com essa pesquisa.
  </div>
</div>

<div class="product-container">
  <h2>Lista de Produtos</h2>

  <div *ngIf="loading" class="info">Carregando produtos...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <ul *ngIf="!loading && !error">
    <li *ngFor="let product of products" class="product-item">
      <h3>{{ product.name }}</h3>
      <p>{{ product.description }}</p>
      <span class="price">{{ product.price | currency:'EUR' }}</span>
    </li>
  </ul>

  <div *ngIf="!loading && products.length === 0 && !error" class="info">
    Nenhum produto encontrado.
  </div>
</div>

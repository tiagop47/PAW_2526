<div class="product-container" style="border: 2px solid green; min-height: 200px;">
  <h2 style="color: blue;">Lista de Produtos ({{ products().length }})</h2>

  <div *ngIf="loading()" class="info">Carregando produtos...</div>
  <div *ngIf="error()" class="error">{{ error() }}</div>

  <div *ngIf="!loading() && !error()">
    <div *ngFor="let product of products()" class="product-item" style="border: 1px solid red; margin: 10px; padding: 10px;">
      <h3>{{ product.nome }}</h3>
      <p>{{ product.preco | currency:'EUR' }}</p>
      <button [routerLink]="['/product', product._id]">Ver Detalhes</button>
    </div>
  </div>

  <div *ngIf="!loading() && products().length === 0 && !error()" class="info">
    Nenhum produto encontrado.
  </div>
</div>

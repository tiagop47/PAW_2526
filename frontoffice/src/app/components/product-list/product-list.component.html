<div class="py-2">

  <!-- Barra de Filtros (auto-contida no componente) -->
  <div class="bg-white border rounded shadow-sm p-4 mb-4">
    <div class="row align-items-end g-3">
      <div class="col-md-4">
        <label class="form-label extra-small fw-bold text-muted text-uppercase">Pesquisar Produto</label>
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-dark"></i></span>
          <input type="text" class="form-control border-start-0" placeholder="Ex: Arroz, Leite..."
                 [(ngModel)]="searchQuery" (input)="onFilterChange()">
        </div>
      </div>

      <div class="col-md-3">
        <label class="form-label extra-small fw-bold text-muted text-uppercase">Filtrar Categoria</label>
        <select class="form-select form-select-sm border-secondary" [(ngModel)]="selectedCategory"
                (change)="onFilterChange()">
          <option value="">Todas as Categorias</option>
          <option *ngFor="let cat of categories" [value]="cat._id">{{ cat.nome }}</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label extra-small fw-bold text-muted text-uppercase">Ordenar por</label>
        <select class="form-select form-select-sm border-secondary" [(ngModel)]="sortBy"
                (change)="onFilterChange()">
          <option value="discount">Melhores Descontos</option>
          <option value="price_asc">Barato para Caro</option>
          <option value="price_desc">Caro para Barato</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Heading -->
  <div class="row mb-2 align-items-center">
    <div class="col">
      <h2 class="h6 fw-bold mb-0 text-uppercase text-muted">Produtos Disponíveis</h2>
    </div>
  </div>
  <hr class="mt-1 mb-4 opacity-10">

  <!-- Grelha de Produtos -->
  <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
    <div *ngFor="let product of filteredProducts" class="col">
      <div class="card h-100 border shadow-sm">
        <div class="p-3 text-center bg-white">
          <img [src]="product.imagem"
               [alt]="product.nome"
               style="height: 120px; object-fit: contain; width: 100%;">
        </div>
        <div class="card-body d-flex flex-column p-3">
          <small class="text-primary fw-bold text-uppercase mb-1" style="font-size: 0.65rem;">
            {{ product.categoriaId.nome || 'Artigo' }}
          </small>
          <h6 class="card-title fw-bold mb-2 text-dark" style="font-size: 0.9rem;">{{ product.nome }}</h6>

          <div class="mt-auto">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="h5 mb-0 fw-bold">{{ product.preco | currency:'EUR' }}</span>
              <div *ngIf="product.precoAntigo && product.precoAntigo > product.preco" class="text-danger small text-decoration-line-through">
                {{ product.precoAntigo | currency:'EUR' }}
              </div>
            </div>
            <button (click)="abrirDetalhe(product._id)" class="btn btn-outline-dark w-100 btn-sm fw-bold">VER DETALHE</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Alerta de Vazio -->
  <div *ngIf="!loading && filteredProducts.length === 0" class="text-center p-5 bg-light rounded border mt-4">
    <i class="bi bi-info-circle display-4 text-muted"></i>
    <p class="mt-3 text-muted">Esta loja não tem produtos disponíveis com os filtros selecionados.</p>
    <a *ngIf="supermarketId" routerLink="/" class="btn btn-sm btn-dark px-4 fw-bold mt-2">VER TODA A REDE</a>
  </div>

</div>

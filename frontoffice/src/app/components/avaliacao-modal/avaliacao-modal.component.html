<div class="modal-overlay">
  <div class="modal-content card">
    <h3 class="mb-4">Avaliar Encomenda</h3>

    <div *ngIf="erro" class="alert alert-danger">{{ erro }}</div>

    <form (ngSubmit)="submeter()" #f="ngForm">
      <div class="mb-3">
        <label class="form-label">
          Supermercado: <strong>{{ order.supermercado.nome }}</strong>
        </label>
        <select class="form-select" name="notaSupermercado" [(ngModel)]="notaSupermercado" required>
          <option [ngValue]="0">-- escolher nota --</option>
          <option *ngFor="let n of notas" [ngValue]="n">{{ n }}</option>
        </select>
      </div>

      <div class="mb-3" *ngIf="order.temEstafeta()">
        <label class="form-label">
          Estafeta: <strong>{{ order.estafeta?.nome }}</strong>
        </label>
        <div>
          <label *ngFor="let n of notas" class="me-3">
            <input type="radio" name="notaEstafeta" [value]="n" [(ngModel)]="notaEstafeta"> {{ n }}
          </label>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Comentário (opcional)</label>
        <textarea class="form-control" name="comentario" [(ngModel)]="comentario" rows="3"></textarea>
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-secondary flex-grow-1" (click)="fechar()" [disabled]="a_submeter">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary flex-grow-1" [disabled]="a_submeter">
          {{ a_submeter ? 'A enviar...' : 'Submeter' }}
        </button>
      </div>
    </form>
  </div>
</div>

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-2">
    <div class="container">

        <button class="navbar-toggler border-0" type="button" (click)="isMenuOpen = !isMenuOpen">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item">
                    <a class="nav-link fw-semibold" routerLink="/"
                        routerLinkActive="text-primary"
                        [routerLinkActiveOptions]="{exact: true}" (click)="isMenuOpen = false">
                        Ver Produtos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" routerLink="/supermercados"
                        routerLinkActive="text-primary" (click)="isMenuOpen = false">
                        Rede de Lojas
                    </a>
                </li>
                <li class="nav-item" *ngIf="(authService.isLoggedIn$ | async)">
                    <a class="nav-link fw-semibold" routerLink="/dashboard"
                        routerLinkActive="text-primary" (click)="isMenuOpen = false">
                        Meu Painel
                    </a>
                </li>
            </ul>

            <div *ngIf="(authService.isLoggedIn$ | async)" class="d-flex align-items-center gap-3">
                <a routerLink="/cart" class="nav-link fw-semibold d-flex align-items-center gap-1"
                    (click)="isMenuOpen = false">
                    Carrinho
                    <span *ngIf="cartService.totalItems() > 0" class="badge bg-primary rounded-pill">
                        {{ cartService.totalItems() }}
                    </span>
                </a>
                <button class="btn btn-outline-danger btn-sm" (click)="logout()">Sair</button>
            </div>

            <div *ngIf="!(authService.isLoggedIn$ | async)" class="d-flex gap-2">
                <a class="btn btn-outline-primary btn-sm" routerLink="/login"
                    (click)="isMenuOpen = false">Entrar</a>
                <a class="btn btn-primary btn-sm" routerLink="/register"
                    (click)="isMenuOpen = false">Registar</a>
            </div>
        </div>
    </div>
</nav>

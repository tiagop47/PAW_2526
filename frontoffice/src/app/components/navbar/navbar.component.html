<nav class="navbar">
  <div class="nav-brand">
    <a routerLink="/" class="logo">
      <span class="logo-text">Loja PAW</span>
    </a>
  </div>
  
  <div class="menu-toggle" (click)="toggleMenu()">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </div>

  <ul class="nav-links" [class.active]="isMenuOpen">
    <li><a routerLink="/" (click)="isMenuOpen = false">Início</a></li>
    <li><a routerLink="/sobre" (click)="isMenuOpen = false">Sobre Nós</a></li>

    <!-- Encomendas (apenas logado) -->
    <li *ngIf="(authService.isLoggedIn$ | async) !== null">
      <a routerLink="/orders" (click)="isMenuOpen = false">Encomendas</a>
    </li>

    <!-- Carrinho -->
    <li class="cart-link">
      <a routerLink="/cart" (click)="isMenuOpen = false" class="cart-icon-link">
        Carrinho
        <span class="cart-badge" *ngIf="cartService.totalItems() > 0">
          {{ cartService.totalItems() }}
        </span>
      </a>
    </li>

    <li class="user-actions" *ngIf="(authService.isLoggedIn$ | async) === null">
      <button class="btn-login" routerLink="/login" (click)="isMenuOpen = false">Entrar</button>
    </li>
    <li class="user-actions" *ngIf="(authService.isLoggedIn$ | async) !== null">
      <button class="btn-login" style="background-color: #dc3545;" (click)="logout()">Sair</button>
    </li>
  </ul>
</nav>

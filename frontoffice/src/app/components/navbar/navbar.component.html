<nav class="navbar">
  <a class="navbar-brand" routerLink="/">Página Principal</a>
  
  <button class="navbar-toggler" (click)="toggleMenu()">
    ☰
  </button>

  <ul class="navbar-nav" [class.show]="isMenuOpen">
    
    <li *ngIf="(authService.isLoggedIn$ | async) !== null">
      <a class="nav-link" routerLink="/orders" routerLinkActive="active" (click)="isMenuOpen = false">Encomendas</a>
    </li>

    <li *ngIf="(authService.isLoggedIn$ | async) !== null">
      <a class="nav-link" routerLink="/avaliacoes" routerLinkActive="active" (click)="isMenuOpen = false">Avaliações</a>
    </li>

    <li *ngIf="(authService.isLoggedIn$ | async) !== null">
      <a class="nav-link" routerLink="/settings" routerLinkActive="active" (click)="isMenuOpen = false">Configuração</a>
    </li>

    <li class="nav-item cart-item">
      <a class="nav-link" routerLink="/cart" routerLinkActive="active" (click)="isMenuOpen = false">
        Carrinho ({{ cartService.totalItems() }})
      </a>
    </li>

    <li *ngIf="(authService.isLoggedIn$ | async) === null" class="d-flex gap-2 ms-3">
      <a class="btn btn-sm btn-outline-primary" routerLink="/login" (click)="isMenuOpen = false">Entrar</a>
      <a class="btn btn-sm btn-primary text-white" routerLink="/register" (click)="isMenuOpen = false">Registar</a>
    </li>

    <li *ngIf="(authService.isLoggedIn$ | async) !== null">
      <button class="btn btn-sm btn-danger" (click)="logout()">Sair</button>
    </li>
  </ul>
</nav>
